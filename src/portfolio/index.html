<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Portfolio</title>
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="theme-color" content="#0b0702">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  // Opened from the home screen (?launch): go straight to the app.
  // Opened in the browser to be added: stay, and set the address the
  // shortcut will keep to the ?launch one, stamped with the time.
  // A ?launch that is still the adding visit stays too: a reload or Safari
  // restoring this tab (flag in this tab), or "Open in Safari" from another
  // app's browser (seconds after the stamp). Redirecting those had Safari
  // save Streamlit's page, and its logo, instead of this one.
  var APP = "https://portfolio-tracker-fronk.streamlit.app/";
  var launch = /[?&]launch(?:=(\d+))?/.exec(location.search);
  var adding = false;
  try { adding = sessionStorage.getItem("adding") === "1"; } catch (e) {}
  var fresh = launch && launch[1] && Date.now() - Number(launch[1]) < 30000;
  var standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  if (standalone || (launch && !adding && !fresh)) location.replace(APP);
  else {
    try { sessionStorage.setItem("adding", "1"); } catch (e) {}
    if (!launch) history.replaceState(null, "", "?launch=" + Date.now());
  }
</script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0b0702; color: #f3e7c9; font: 17px/1.5 system-ui, sans-serif;
         text-align: center; padding: 0 16px; }
  img { border-radius: 22%; }
  a { color: #f5c451; }
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" width="96" height="96" alt="">
  <h1>Portfolio Tracker</h1>
  <p>Add this page to your home screen.<br>
     iPhone: Share &rarr; Add to Home Screen.<br>
     Android: &#8942; &rarr; Add to Home screen.</p>
  <p><a href="https://portfolio-tracker-fronk.streamlit.app/">Open the tracker</a></p>
</main>
</body>
</html>
